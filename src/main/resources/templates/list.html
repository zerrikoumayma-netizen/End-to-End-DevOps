<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Liste des posts</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F7F5F2; --surface: #FFFFFF;
            --text-primary: #1A1A18; --text-secondary: #6B6B65;
            --accent: #2D6A4F; --accent-light: #E8F4EF;
            --border: #E2E0DB; --radius: 12px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; }
        nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--accent); text-decoration: none; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .nav-link { color: var(--text-secondary); font-size: 0.88rem; text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 8px; transition: background 0.15s, color 0.15s; }
        .nav-link:hover { background: var(--accent-light); color: var(--accent); }
        .btn-new { background: var(--accent); color: #fff; font-size: 0.85rem; font-weight: 600; padding: 0.45rem 1rem; border-radius: 8px; text-decoration: none; transition: background 0.2s; }
        .btn-new:hover { background: #235A40; }
        .container { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
        .page-header { margin-bottom: 2rem; }
        .page-header h1 { font-family: 'DM Serif Display', serif; font-size: 2.2rem; color: var(--text-primary); margin-bottom: 0.3rem; }
        .page-header p { color: var(--text-secondary); font-size: 0.9rem; }
        .post-list { display: flex; flex-direction: column; gap: 1rem; }
        .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start; transition: box-shadow 0.2s, transform 0.15s; }
        .post-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); transform: translateY(-1px); }
        .post-meta { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .post-author { font-size: 0.78rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
        .post-date { font-size: 0.78rem; color: var(--text-secondary); }
        .post-dot { width: 3px; height: 3px; background: var(--border); border-radius: 50%; }
        .post-title { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.4rem; line-height: 1.4; }
        .post-excerpt { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; }
        .post-actions { display: flex; gap: 0.5rem; flex-shrink: 0; margin-left: 1.5rem; }
        .btn-action { font-size: 0.8rem; font-weight: 500; padding: 0.4rem 0.85rem; border-radius: 8px; text-decoration: none; border: 1.5px solid; transition: background 0.15s, color 0.15s; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .btn-view { color: var(--accent); border-color: var(--accent); background: transparent; }
        .btn-view:hover { background: var(--accent-light); }
        .btn-edit { color: var(--text-secondary); border-color: var(--border); background: transparent; }
        .btn-edit:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .btn-delete { color: #C0392B; border-color: #FECACA; background: transparent; }
        .btn-delete:hover { background: #FEF2F2; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-secondary); }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h2 { font-family: 'DM Serif Display', serif; color: var(--text-primary); margin-bottom: 0.5rem; }
        .logout-form { display: inline; }
        .btn-logout { background: transparent; border: none; color: var(--text-secondary); font-size: 0.88rem; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s, color 0.15s; }
        .btn-logout:hover { background: #FEF2F2; color: #C0392B; }
        @media (max-width: 600px) { .post-card { flex-direction: column; } .post-actions { margin-left: 0; margin-top: 1rem; } }
    </style>
</head>
<body>
<nav>
    <a class="nav-brand" th:href="@{/posts}">Demo3</a>
    <div class="nav-actions">
        <a class="btn-new" th:href="@{/posts/new}">+ Nouveau post</a>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Déconnexion</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Tous les posts</h1>
        <p th:text="${#lists.size(posts)} + ' publication(s)'">0 publications</p>
    </div>

    <div class="post-list" th:if="${not #lists.isEmpty(posts)}">
        <div class="post-card" th:each="post : ${posts}">
            <div>
                <div class="post-meta">
                    <!-- CORRIGÉ : post.author.username au lieu de post.author -->
                    <span class="post-author" th:text="${post.author != null ? post.author.username : 'Anonyme'}">Auteur</span>
                </div>
                <div class="post-title" th:text="${post.title}">Titre</div>
                <div class="post-excerpt" th:text="${#strings.abbreviate(post.content, 120)}">Contenu…</div>
            </div>
            <div class="post-actions">
                <a class="btn-action btn-view" th:href="@{/posts/{id}(id=${post.id})}">Voir</a>
                <a class="btn-action btn-edit" th:href="@{/posts/{id}/edit(id=${post.id})}">Éditer</a>
                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn-action btn-delete">Suppr.</button>
                </form>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(posts)}">
        <div class="icon">📝</div>
        <h2>Aucun post pour l'instant</h2>
        <p>Commencez par créer votre premier post.</p>
    </div>
</div>
</body>
</html>
