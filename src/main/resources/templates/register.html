<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Inscription</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F7F5F2; --surface: #FFFFFF;
            --text-primary: #1A1A18; --text-secondary: #6B6B65;
            --accent: #2D6A4F; --accent-light: #E8F4EF;
            --border: #E2E0DB; --radius: 12px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .split { display: flex; width: 100%; max-width: 960px; background: var(--surface); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 40px rgba(0,0,0,0.08); }
        .side-panel { width: 38%; background: var(--accent); padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .side-panel::before { content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%; background: rgba(255,255,255,0.06); bottom: -80px; right: -80px; }
        .brand { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: #fff; }
        .side-text h2 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: #fff; line-height: 1.25; margin-bottom: 1rem; }
        .side-text p { color: rgba(255,255,255,0.7); font-size: 0.9rem; line-height: 1.65; }
        .form-panel { width: 62%; padding: 3rem; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
        .form-header { margin-bottom: 2rem; }
        .form-header h1 { font-family: 'DM Serif Display', serif; font-size: 1.9rem; color: var(--text-primary); margin-bottom: 0.3rem; }
        .form-header p { color: var(--text-secondary); font-size: 0.88rem; }

        /* SECTIONS */
        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin: 1.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1.1rem; }
        label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.45rem; }
        input[type="text"], input[type="email"], input[type="password"], input[type="url"], textarea {
            width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius);
            font-family: 'DM Sans', sans-serif; font-size: 0.93rem; color: var(--text-primary);
            background: #FAFAF8; transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
        input:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-light); }
        .optional { font-size: 0.72rem; color: var(--text-secondary); font-style: italic; margin-left: 0.3rem; text-transform: none; letter-spacing: 0; }

        .btn-submit { width: 100%; padding: 0.85rem; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: background 0.2s, transform 0.1s; }
        .btn-submit:hover { background: #235A40; }
        .btn-submit:active { transform: scale(0.99); }
        .login-link { margin-top: 1.2rem; text-align: center; font-size: 0.86rem; color: var(--text-secondary); }
        .login-link a { color: var(--accent); font-weight: 500; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }

        @media (max-width: 700px) {
            .split { flex-direction: column; }
            .side-panel { width: 100%; min-height: 130px; padding: 1.5rem 2rem; }
            .side-text { display: none; }
            .form-panel { width: 100%; padding: 2rem; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="split">
    <div class="side-panel">
        <div class="brand">Demo3</div>
        <div class="side-text">
            <h2>Créez votre compte</h2>
            <p>Rejoignez la communauté, publiez des articles et des vidéos, interagissez avec les autres membres.</p>
        </div>
    </div>

    <div class="form-panel">
        <div class="form-header">
            <h1>Inscription</h1>
            <p>Remplissez le formulaire ci-dessous</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <!-- COMPTE -->
            <div class="section-title">Informations du compte</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="jean_dupont" required/>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="jean@email.com" required/>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required/>
            </div>

            <!-- PROFIL -->
            <div class="section-title">Profil <span class="optional">(optionnel)</span></div>
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" placeholder="Parlez-nous un peu de vous…"></textarea>
            </div>
            <div class="form-group">
                <label for="avatar">Avatar <span class="optional">URL d'une image</span></label>
                <input type="url" id="avatar" name="avatar" placeholder="https://exemple.com/photo.jpg"/>
            </div>

            <button type="submit" class="btn-submit">Créer mon compte →</button>
        </form>

        <p class="login-link">Déjà un compte ? <a th:href="@{/login}">Se connecter</a></p>
    </div>
</div>
</body>
</html>
